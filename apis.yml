name: The League
description: 'The League is an American social and dating mobile application founded in 2014 by Amanda
  Bradford and launched in 2015. It positions itself as a selective, career-oriented dating community
  ("Date. Intelligently."), using an application/waitlist model and LinkedIn/Facebook-based verification
  to curate its membership. The League was acquired by Match Group in 2022 and operates as a consumer
  iOS/Android app. It is a portfolio company of Cowboy Ventures. As a consumer mobile app it publishes
  no public developer program, API documentation, or partner API surface.'
